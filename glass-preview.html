<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0d1fd4}
#c{position:fixed;inset:0;width:100vw;height:100vh}
#panel{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.5 monospace;color:#fff;background:rgba(0,0,0,.55);padding:12px 14px;border-radius:10px;width:236px;backdrop-filter:blur(6px)}
#panel label{display:block}#panel input{width:100%}</style>
<script type="importmap">{"imports":{"three-hero":"./vendor/three.hero.module.min.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="panel">
  <div style="font-weight:bold;margin-bottom:6px">glass controls — drag, then hit copy &amp; send me</div>
  <button id="envbtn" style="width:100%;padding:6px;margin-bottom:6px;cursor:pointer">env: studio</button>
  <label>rotX <span id="vrx"></span><input id="rx" type="range" min="-1.6" max="0.4" step="0.01" value="-0.78"></label>
  <label>rotY <span id="vry"></span><input id="ry" type="range" min="-1.2" max="1.2" step="0.01" value="0.02"></label>
  <label>rotZ <span id="vrz"></span><input id="rz" type="range" min="-1.0" max="1.0" step="0.01" value="0.55"></label>
  <label>zoom <span id="vzm"></span><input id="zm" type="range" min="6" max="16" step="0.2" value="10.6"></label>
  <label>dispersion <span id="vds"></span><input id="ds" type="range" min="0" max="16" step="0.1" value="8"></label>
  <label>ior <span id="vio"></span><input id="io" type="range" min="1.1" max="2.2" step="0.01" value="1.5"></label>
  <label>exposure <span id="vex"></span><input id="ex" type="range" min="0.4" max="3" step="0.05" value="1.4"></label>
  <label>env bright <span id="vev"></span><input id="ev" type="range" min="0.5" max="8" step="0.1" value="3"></label>
  <label>thickness <span id="vth"></span><input id="th" type="range" min="0.1" max="10" step="0.1" value="3"></label>
  <label>roughness <span id="vrg"></span><input id="rg" type="range" min="0" max="0.6" step="0.005" value="0.06"></label>
  <label>fog depth <span id="vfg"></span><input id="fg" type="range" min="30" max="100" step="1" value="50"></label>
  <button id="dump" style="margin-top:8px;width:100%;padding:6px;cursor:pointer">copy values</button>
  <div id="out" style="margin-top:6px;word-break:break-all;color:#8fd"></div>
</div>
<script type="module">
import * as THREE from 'three-hero';
import {FontLoader} from './vendor/FontLoader.hero.js';
import {TextGeometry} from './vendor/TextGeometry.hero.js';
import {RoomEnvironment} from './vendor/RoomEnvironment.hero.js';
import {RGBELoader} from './vendor/RGBELoader.hero.js';

const BLUE=0x0d1fd4;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:false,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.4;
const scene=new THREE.Scene();
scene.background=new THREE.Color(BLUE);
scene.fog=new THREE.Fog(BLUE, 32, 50);

// ── TRUE orthographic (full isometric) ──
let ZOOM=10.6;
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-100,200);
camera.position.set(0,0,20);
function resize(){ const w=innerWidth,h=innerHeight,a=w/h;
  camera.left=-ZOOM*a/2; camera.right=ZOOM*a/2; camera.top=ZOOM/2; camera.bottom=-ZOOM/2;
  camera.updateProjectionMatrix(); renderer.setSize(w,h,false); }
addEventListener('resize',resize); resize();

// ── rich studio env: gradient dome + bright softboxes → real glass reflections ──
function studioScene(){
  const s=new THREE.Scene();
  const cv=document.createElement('canvas'); cv.width=8; cv.height=256;
  const g=cv.getContext('2d'); const grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(0.35,'#cfd9f2'); grd.addColorStop(0.62,'#5f73b0'); grd.addColorStop(1,'#0a1024');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  s.add(new THREE.Mesh(new THREE.SphereGeometry(60,32,24), new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide})));
  const panel=(w,h,x,y,z,rx,ry,col,i)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({emissive:col,emissiveIntensity:i,color:0})); m.position.set(x,y,z); m.rotation.set(rx,ry,0); s.add(m); };
  panel(26,8,0,16,3,Math.PI/2,0,0xffffff,16);
  panel(10,14,-15,4,3,0,Math.PI/2,0xdfeaff,8);
  panel(10,14,15,4,3,0,-Math.PI/2,0xffe9d0,5);
  panel(22,14,0,2,20,0,Math.PI,0xf2f6ff,7);
  return s;
}
const pmrem=new THREE.PMREMGenerator(renderer);
const studioTex=pmrem.fromScene(studioScene(),0.02).texture;
const roomTex=pmrem.fromScene(new RoomEnvironment(),0.02).texture;
let hdrTex=null;
new RGBELoader().load('./vendor/studio_small_09_1k.hdr',tex=>{ tex.mapping=THREE.EquirectangularReflectionMapping; hdrTex=pmrem.fromEquirectangular(tex).texture; tex.dispose(); });
scene.environment=studioTex;

// crisp glass — low roughness so reflections read as glass, strong dispersion
const glass=new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.06,
  transmission:1, thickness:3, ior:1.5, dispersion:8,
  clearcoat:0, envMapIntensity:3,
  attenuationColor:new THREE.Color(0xffffff), attenuationDistance:1e4, transparent:true
});
const ballMat=new THREE.MeshStandardMaterial({color:0xf5d94e, metalness:0, roughness:1, envMapIntensity:0.7});

const group=new THREE.Group();
let baseRX=-0.78, baseRY=0.02, baseRZ=0.55;
group.rotation.set(baseRX,baseRY,baseRZ);
scene.add(group);
const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,7,6); scene.add(key);
const rim=new THREE.DirectionalLight(0x9fbcff,0.9); rim.position.set(-6,-2,4); scene.add(rim);
scene.add(new THREE.AmbientLight(0x2a3a5a,0.4));

// bolder grid on the ground (z=0), the letters extrude up from it (+Z)
const grid=new THREE.GridHelper(60,60,0xcdd9ff,0x7f97ec);
grid.rotation.x=Math.PI/2; grid.material.transparent=true; grid.material.opacity=0.42; grid.material.depthWrite=false;
group.add(grid);

// soft contact shadow blob, grounding the sign on the grid
(function(){
  const cv=document.createElement('canvas'); cv.width=cv.height=256; const g=cv.getContext('2d');
  const rg=g.createRadialGradient(128,128,10,128,128,128); rg.addColorStop(0,'rgba(2,6,26,0.6)'); rg.addColorStop(1,'rgba(2,6,26,0)');
  g.fillStyle=rg; g.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(cv);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(20,8), new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
  sh.position.set(0,-0.3,0.02); group.add(sh);
})();

let text=null; const balls=[];
const DEPTH=0.77;
new FontLoader().load('./vendor/helvetiker_bold.typeface.json',font=>{
  const geo=new TextGeometry('eccho',{font,size:2.6,height:DEPTH,curveSegments:20,bevelEnabled:false});
  geo.center(); geo.translate(0,0,DEPTH/2);   // back face on z=0, extrudes only toward +Z
  text=new THREE.Mesh(geo,glass); group.add(text);
  const seeds=[[-9,4,0.7],[9,3,0.85],[-11,-3,0.55],[11,-1,0.6],[-7,-5,0.55],[7,-5,0.6],
    [0,6,0.5],[-3,-6,0.45],[13,5,0.7],[-13,2,0.6],[4,7,0.5],[-6,7,0.55],[12,-5,0.65],[-12,-6,0.6]];
  seeds.forEach(s=>{ const r=s[2]; const m=new THREE.Mesh(new THREE.SphereGeometry(r,36,36), ballMat.clone());
    m.material.transparent=true;
    m.position.set(s[0], s[1], r + Math.random()*4);
    m.userData={ r, vel:new THREE.Vector3((Math.random()-.5)*0.012,(Math.random()-.5)*0.012,(Math.random()-.5)*0.012),
      spin:new THREE.Vector3((Math.random()-.5)*0.006,(Math.random()-.5)*0.006,0) };
    group.add(m); balls.push(m); });
});

// hover → extrude the letters
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(999,999); let over=false, extrude=1;
addEventListener('pointermove',e=>{ ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; });

function loop(now){
  const t=now*0.001;
  if(text){
    ray.setFromCamera(ptr,camera);
    over = ray.intersectObject(text,false).length>0;
    extrude += ((over?1.9:1.0)-extrude)*0.12; text.scale.z=extrude;
  }
  balls.forEach(m=>{
    const u=m.userData, p=m.position, r=u.r;
    u.vel.z -= 0.00035;                                            // barely any gravity → they float
    u.vel.x += (Math.random()-.5)*0.0006; u.vel.y += (Math.random()-.5)*0.0006; u.vel.z += (Math.random()-.5)*0.0005;  // gentle organic drift
    p.add(u.vel);
    if(p.z < r){ p.z=r; u.vel.z=Math.abs(u.vel.z)*0.5; }           // slow soft bounce off the ground
    if(p.z > 11) u.vel.z -= 0.0008;                                // soft ceiling so they don't drift away
    const d=Math.hypot(p.x,p.y); if(d<7.5){ u.vel.x+=(p.x/(d||1))*0.0016; u.vel.y+=(p.y/(d||1))*0.0016; }  // keep off the sign
    if(p.x<-16||p.x>16) u.vel.x*=-1;
    if(p.y<-10||p.y>10) u.vel.y*=-1;
    u.vel.multiplyScalar(0.985);                                   // damping keeps everything slow & airy
    m.rotation.x+=u.spin.x; m.rotation.y+=u.spin.y;
  });
  group.rotation.set(baseRX,baseRY,baseRZ);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── controls ──
const $=id=>document.getElementById(id);
function bind(id,fn){ const el=$(id),v=$('v'+id); const set=()=>{ const n=parseFloat(el.value); v.textContent=n.toFixed(2); fn(n); }; el.addEventListener('input',set); set(); }
bind('rx',n=>baseRX=n); bind('ry',n=>baseRY=n); bind('rz',n=>baseRZ=n);
bind('zm',n=>{ ZOOM=n; resize(); });
bind('ds',n=>glass.dispersion=n);
bind('io',n=>glass.ior=n);
bind('ex',n=>renderer.toneMappingExposure=n);
bind('ev',n=>glass.envMapIntensity=n);
bind('th',n=>glass.thickness=n);
bind('rg',n=>glass.roughness=n);
bind('fg',n=>{ scene.fog.far=n; scene.fog.near=Math.max(10,n-18); });
const envKeys=['studio','room','hdri']; let envIdx=0;
function applyEnv(){ const k=envKeys[envIdx]; scene.environment = k==='hdri'?(hdrTex||studioTex):(k==='room'?roomTex:studioTex); $('envbtn').textContent='env: '+k; }
$('envbtn').addEventListener('click',()=>{ envIdx=(envIdx+1)%envKeys.length; applyEnv(); });
$('dump').addEventListener('click',()=>{ const s='rot('+baseRX+','+baseRY+','+baseRZ+') zoom='+ZOOM+' env='+envKeys[envIdx]+' dispersion='+glass.dispersion+' ior='+glass.ior+' exposure='+renderer.toneMappingExposure+' envBright='+glass.envMapIntensity+' thickness='+glass.thickness+' roughness='+glass.roughness+' fog='+scene.fog.far; $('out').textContent=s; if(navigator.clipboard) navigator.clipboard.writeText(s); });
</script></body></html>
