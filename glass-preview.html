<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#070d20;overflow:hidden}
#c{position:fixed;inset:0;width:100vw;height:100vh}
/* subtle floating tiles feel via a dark radial vignette on a blue base */
body{background:radial-gradient(120% 90% at 50% 40%, #0d1838 0%, #070c1c 60%, #04060f 100%)}</style>
<script type="importmap">{"imports":{"three-hero":"./vendor/three.hero.module.min.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="panel" style="position:fixed;top:12px;left:12px;z-index:10;font:12px/1.5 monospace;color:#fff;background:rgba(0,0,0,.55);padding:12px 14px;border-radius:10px;width:230px;backdrop-filter:blur(6px)">
  <div style="font-weight:bold;margin-bottom:6px">glass controls — drag, then send me the values</div>
  <label>rotX <span id="vrx"></span><input id="rx" type="range" min="-1.2" max="0.4" step="0.01" value="-0.35" style="width:100%"></label>
  <label>rotY <span id="vry"></span><input id="ry" type="range" min="-1.2" max="1.2" step="0.01" value="0.45" style="width:100%"></label>
  <label>rotZ <span id="vrz"></span><input id="rz" type="range" min="-0.6" max="0.6" step="0.01" value="-0.05" style="width:100%"></label>
  <label>dispersion <span id="vds"></span><input id="ds" type="range" min="0" max="12" step="0.1" value="5" style="width:100%"></label>
  <label>exposure <span id="vex"></span><input id="ex" type="range" min="0.4" max="3" step="0.05" value="1.25" style="width:100%"></label>
  <label>env bright <span id="vev"></span><input id="ev" type="range" min="0.5" max="6" step="0.1" value="2.2" style="width:100%"></label>
  <label>thickness <span id="vth"></span><input id="th" type="range" min="0.1" max="4" step="0.1" value="1.2" style="width:100%"></label>
  <label>roughness <span id="vrg"></span><input id="rg" type="range" min="0" max="0.4" step="0.005" value="0.02" style="width:100%"></label>
  <button id="dump" style="margin-top:8px;width:100%;padding:6px;cursor:pointer">copy values</button>
  <div id="out" style="margin-top:6px;word-break:break-all;color:#8fd"></div>
</div>
<script type="module">
import * as THREE from 'three-hero';
import {FontLoader} from './vendor/FontLoader.hero.js';
import {TextGeometry} from './vendor/TextGeometry.hero.js';
import {RoomEnvironment} from './vendor/RoomEnvironment.hero.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1fd4);   // solid brand blue (also gives transmission something to refract)

// Perspective TELEPHOTO ≈ isometric look WITHOUT breaking transmission
// (a true orthographic camera renders the glass opaque/matte).
const camera=new THREE.PerspectiveCamera(15,1,0.1,200);
camera.position.set(0,0,44);
function resize(){
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
addEventListener('resize',resize); resize();

// bright neutral studio + a couple of extra softbox panels for crisp chrome
function extraPanels(){
  const s=new THREE.Scene();
  function panel(w,h,x,y,z,rx,ry,col,inten){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({emissive:col,emissiveIntensity:inten,color:0}));
    m.position.set(x,y,z); m.rotation.set(rx,ry,0); s.add(m); }
  panel(30,10,0,14,4,Math.PI/2,0,0xffffff,10);   // ceiling
  panel(30,22,0,2,22,0,Math.PI,0xeef4ff,5);       // front (bright front faces)
  panel(14,20,-16,3,4,0,Math.PI/2,0xcfe0ff,7);    // left cool
  panel(14,20,16,3,4,0,-Math.PI/2,0xffe9d0,4);     // right warm
  return s;
}
const pmrem=new THREE.PMREMGenerator(renderer);
const roomTex=pmrem.fromScene(new RoomEnvironment(),0.02).texture;
const panelTex=pmrem.fromScene(extraPanels(),0.02).texture;
scene.environment=panelTex;   // start with the crisp panels

const glass=new THREE.MeshPhysicalMaterial({
  color:0xf4f8ff, metalness:0, roughness:0.02,
  transmission:1, thickness:1.2, ior:1.5, dispersion:5.0,
  iridescence:0.35, iridescenceIOR:1.3,
  clearcoat:1, clearcoatRoughness:0.02, envMapIntensity:2.2,
  specularIntensity:1, attenuationColor:new THREE.Color(0xcfe0ff), attenuationDistance:8, transparent:true
});

const group=new THREE.Group();
let baseRX=-0.35, baseRY=0.45, baseRZ=-0.05;   // slider-controlled
group.rotation.set(baseRX,baseRY,baseRZ);
scene.add(group);
const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(4,7,6); scene.add(key);
const rim=new THREE.DirectionalLight(0x9fbcff,0.9); rim.position.set(-6,-2,4); scene.add(rim);
scene.add(new THREE.AmbientLight(0x2a3a5a,0.4));

let text=null; const balls=[];
new FontLoader().load('./vendor/helvetiker_bold.typeface.json',font=>{
  const geo=new TextGeometry('eccho',{font,size:2.6,height:1.1,curveSegments:18,
    bevelEnabled:true,bevelThickness:0.34,bevelSize:0.30,bevelSegments:10});
  geo.center();
  text=new THREE.Mesh(geo,glass); group.add(text);
  const targets=[[-7.4,2.6,-0.4,0.66],[7.2,2.3,-0.5,0.8],[-8.4,-0.4,-0.6,0.46],[8.5,0.1,0.5,0.5],
    [-6.4,-2.7,0.4,0.54],[6.6,-2.5,0.5,0.6]];
  targets.forEach(t=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(t[3],48,48),glass);
    m.position.set(t[0],t[1],t[2]); m.userData.by=t[1]; group.add(m); balls.push(m); });
});

// hover → extrude the letters more (scale along the extrusion axis)
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(999,999); let over=false;
addEventListener('pointermove',e=>{ ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; });
let extrude=1, mx=0,my=0;
addEventListener('pointermove',e=>{ mx=e.clientX/innerWidth-0.5; my=e.clientY/innerHeight-0.5; });

function loop(now){
  const t=now*0.001;
  if(text){
    ray.setFromCamera(ptr,camera);
    over = ray.intersectObject(text,false).length>0;
    const target = over?1.9:1.0;
    extrude += (target-extrude)*0.12;
    text.scale.z = extrude;
  }
  balls.forEach((m,i)=>{ m.position.y = m.userData.by + Math.sin(t*0.7+i)*0.12; m.rotation.x=t*0.2; m.rotation.y=t*0.16; });
  group.rotation.set(baseRX, baseRY, baseRZ);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── live controls ──
const $=id=>document.getElementById(id);
function bind(id,fn){ const el=$(id),v=$('v'+id); const set=()=>{ const n=parseFloat(el.value); v.textContent=n.toFixed(2); fn(n); }; el.addEventListener('input',set); set(); }
bind('rx',n=>baseRX=n); bind('ry',n=>baseRY=n); bind('rz',n=>baseRZ=n);
bind('ds',n=>glass.dispersion=n);
bind('ex',n=>renderer.toneMappingExposure=n);
bind('ev',n=>glass.envMapIntensity=n);
bind('th',n=>glass.thickness=n);
bind('rg',n=>glass.roughness=n);
$('dump').addEventListener('click',()=>{ const s='rot('+baseRX+', '+baseRY+', '+baseRZ+')  dispersion='+glass.dispersion+'  exposure='+renderer.toneMappingExposure+'  env='+glass.envMapIntensity+'  thickness='+glass.thickness+'  roughness='+glass.roughness; $('out').textContent=s; if(navigator.clipboard) navigator.clipboard.writeText(s); });
</script></body></html>
